<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KL TOCHIQUE — Controle Direto</title>
<style>
/* Mantive todo o seu CSS original para não quebrar o visual */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{
  --bg:#05050a;--panel:#0b0c12;--panel2:#0f1119;--ink:#edfaff;--muted:#77808f;
  --green:#38f2dc;--cyan:#38f2dc;--yellow:#f5e32d;--pink:#ff2f91;--danger:#ff476f;--warn:#f5e32d;--blue:#49a7ff;
  --line:rgba(56,242,220,.18);--line-strong:rgba(56,242,220,.42);--shadow:0 22px 90px rgba(0,0,0,.58);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'JetBrains Mono',monospace;background:
  radial-gradient(circle at 12% 0%,rgba(255,47,145,.10),transparent 28%),
  radial-gradient(circle at 92% 12%,rgba(56,242,220,.08),transparent 26%),
  linear-gradient(180deg,#07070d 0%,#040408 100%);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(56,242,220,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(56,242,220,.025) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.045) 4px)}
.wrap{position:relative;z-index:1;max-width:1580px;margin:0 auto;padding:28px 22px 70px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px;padding:18px 20px;border-left:4px solid var(--yellow);background:linear-gradient(90deg,rgba(245,227,45,.08),transparent 55%);clip-path:polygon(0 0,96% 0,100% 28%,100% 100%,0 100%)}
.kicker{color:var(--pink);font:700 11px 'Orbitron',sans-serif;letter-spacing:.24em;text-transform:uppercase;margin-bottom:5px}.brand{margin:0;font:800 clamp(28px,4vw,54px) 'Orbitron',sans-serif;letter-spacing:.06em;line-height:.92}.brand span{color:var(--yellow);text-shadow:0 0 22px rgba(245,227,45,.28)}
.subtitle{color:#8e97a7;font-size:12px;margin-top:10px;max-width:780px}.hero-code{color:var(--cyan);font:600 11px 'JetBrains Mono',monospace;text-align:right;line-height:1.8}.hero-code b{color:var(--yellow)}
.top,.card,.viewer{position:relative;background:linear-gradient(160deg,rgba(16,18,27,.96),rgba(7,8,13,.98));border:1px solid rgba(56,242,220,.18);box-shadow:var(--shadow);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.top::before,.card::before,.viewer::before{content:"";position:absolute;left:0;top:0;width:82px;height:2px;background:linear-gradient(90deg,var(--yellow),transparent)}
.top{padding:16px 18px;margin-bottom:14px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,select{color:var(--ink);background:#06070b;border:1px solid rgba(56,242,220,.26);padding:11px 12px;min-width:220px;outline:none;font:500 12px 'JetBrains Mono',monospace;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%)}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(56,242,220,.16),0 0 24px rgba(56,242,220,.08)}
button{position:relative;padding:10px 14px;border:1px solid rgba(56,242,220,.30);background:linear-gradient(180deg,#11141d,#090b11);color:#d8fff9;cursor:pointer;font:700 11px 'Orbitron',sans-serif;letter-spacing:.035em;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));transition:.16s transform,.16s border-color,.16s box-shadow,.16s color}
button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--cyan);color:#fff;box-shadow:0 0 24px rgba(56,242,220,.12)}button:disabled{opacity:.34;cursor:not-allowed;filter:saturate(.3)}
.primary{background:linear-gradient(135deg,rgba(245,227,45,.18),rgba(56,242,220,.08))!important;border-color:rgba(245,227,45,.52)!important;color:var(--yellow)!important}.danger{border-color:rgba(255,47,145,.55)!important;color:#ff77b7!important}.warn{border-color:rgba(245,227,45,.48)!important;color:#fff36f!important}
.status{font:700 11px 'Orbitron',sans-serif;letter-spacing:.08em}.ok{color:var(--cyan)}.bad{color:var(--danger)}.wait{color:var(--yellow)}
#agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(370px,1fr));gap:12px;margin-bottom:14px}.card{padding:17px 18px}.agent-title{font:700 15px 'Orbitron',sans-serif;margin-bottom:8px;color:#f3fbff}.small{color:var(--muted);font-size:11px}.badge{display:inline-block;padding:3px 7px;border:1px solid rgba(245,227,45,.3);background:rgba(245,227,45,.06);font-size:10px;color:var(--yellow)}
.permissions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}.pill{padding:8px 9px;border-left:2px solid #343a47;background:#080a10;font:700 10px 'JetBrains Mono',monospace}.pill.on{color:var(--cyan);border-color:var(--cyan);background:rgba(56,242,220,.055)}.pill.off{color:#727b89}.pill.busy{color:var(--yellow);border-color:var(--yellow);background:rgba(245,227,45,.05)}.pill.alert{color:#ff73b7;border-color:var(--pink);background:rgba(255,47,145,.07)}
.viewer{padding:18px}.section-title{font:700 17px 'Orbitron',sans-serif;letter-spacing:.06em;margin:0 0 12px;color:#f7fbff}.section-title::before{content:"[ ";color:var(--pink)}.section-title::after{content:" ]";color:var(--pink)}
.toolbar{margin-bottom:12px;padding:11px 12px;border:1px solid rgba(56,242,220,.11);background:#080a10}.control-banner{margin:10px 0;padding:11px 12px;background:rgba(255,47,145,.07);border-left:3px solid var(--pink);color:#ff83bd;font:700 11px 'Orbitron',sans-serif;display:none}
.notice{padding:11px 12px;border-left:3px solid var(--cyan);background:rgba(56,242,220,.05);color:#9fded7;font-size:11px;margin:8px 0 12px}.notice.warning{border-left-color:var(--yellow);background:rgba(245,227,45,.055);color:#e8de86}
.screen-wrap{position:relative;background:#010205;border:1px solid rgba(56,242,220,.25);overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:480px;cursor:crosshair;box-shadow:inset 0 0 70px rgba(0,0,0,.78)}.screen-wrap::before{content:"LIVE FEED // KL-NET";position:absolute;z-index:4;left:12px;top:10px;color:rgba(56,242,220,.62);font:700 9px 'Orbitron',sans-serif;letter-spacing:.14em;pointer-events:none}.screen-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(90deg,rgba(255,47,145,.12),transparent 2%,transparent 98%,rgba(56,242,220,.12));mix-blend-mode:screen}
canvas{display:block;max-width:100%;height:auto;outline:none;position:relative;z-index:1}.empty-screen{position:absolute;color:#4e5867;font:600 12px 'Orbitron',sans-serif;letter-spacing:.08em;pointer-events:none;z-index:2}.maintenance-overlay{position:absolute;inset:0;z-index:8;background:rgba(3,3,7,.97);display:none;align-items:center;justify-content:center;text-align:center;padding:30px}.maintenance-overlay .inner{border:1px solid rgba(245,227,45,.35);padding:28px 32px;max-width:620px;box-shadow:0 0 60px rgba(245,227,45,.06)}.maintenance-overlay h3{margin:0 0 12px;color:var(--yellow);font:800 22px 'Orbitron',sans-serif;letter-spacing:.08em}.maintenance-overlay p{margin:0;color:#9ba4b1;font-size:12px;line-height:1.7}
.metrics{margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px}.metrics span{padding:10px 11px;background:#080a10;border-bottom:2px solid rgba(56,242,220,.18);color:#8da6a6;font:600 10px 'Orbitron',sans-serif;letter-spacing:.04em}
.advanced-section{margin-top:18px;padding-top:18px;border-top:1px solid rgba(56,242,220,.15)}.control-cluster{padding:13px;border:1px solid rgba(245,227,45,.14);background:linear-gradient(90deg,rgba(245,227,45,.035),transparent)}
.terminal-box{background:#020306;color:var(--cyan);padding:14px;border:1px solid rgba(56,242,220,.17);min-height:120px;max-height:260px;overflow-y:auto;font:11px 'JetBrains Mono',monospace;margin-top:9px;white-space:pre-wrap}.keylog-container{min-height:120px;max-height:300px;overflow-y:auto;margin-top:18px;padding:15px;border:1px solid rgba(255,47,145,.16);background:rgba(5,5,9,.82)}.log-entry{font:11px 'JetBrains Mono',monospace;padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.045);color:#aeb8c6}.log-time{color:#535d6a;margin-right:8px}.
