<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmpresaMonitor V2 Live</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f5f8;color:#151515;margin:0}
.wrap{max-width:1280px;margin:24px auto;padding:0 18px}
.top,.card,.viewer{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{padding:11px 12px;border:1px solid #ccc;border-radius:8px;min-width:300px}
button{padding:10px 14px;border:1px solid #bbb;background:#fff;border-radius:8px;cursor:pointer}
button:hover{background:#f1f1f1}
.status{font-weight:bold}
.ok{color:#087c3e}.bad{color:#b40000}.wait{color:#a36a00}
.agent-title{font-size:18px;font-weight:bold}
.small{color:#666;font-size:13px}
.screen-wrap{background:#111;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:340px}
canvas{display:block;max-width:100%;height:auto}
.metrics{margin-top:10px;color:#555}
</style>
</head>
<body>
<div class="wrap">
  <h1>EmpresaMonitor V2 — Live</h1>

  <div class="top">
    <div class="row">
      <input id="wsUrl" placeholder="wss://seu-realtime.onrender.com">
      <input id="token" type="password" placeholder="ADMIN_TOKEN">
      <button id="connectBtn">Conectar</button>
      <span id="connStatus" class="status"></span>
    </div>
  </div>

  <div id="agents"></div>

  <div class="viewer">
    <h2>Visualização ao vivo</h2>
    <div class="screen-wrap">
      <canvas id="screen" width="1280" height="720"></canvas>
    </div>
    <div class="metrics">
      <span id="fps">FPS: 0</span> ·
      <span id="lat">Frames recebidos: 0</span>
    </div>
  </div>
</div>

<script>
const wsUrlEl = document.getElementById('wsUrl');
const tokenEl = document.getElementById('token');
const connectBtn = document.getElementById('connectBtn');
const connStatus = document.getElementById('connStatus');
const agentsEl = document.getElementById('agents');
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const fpsEl = document.getElementById('fps');
const latEl = document.getElementById('lat');

let ws = null;
let agents = [];
let selectedAgentId = null;
let frames = 0;
let fpsFrames = 0;
let lastFps = performance.now();

wsUrlEl.value = localStorage.getItem('em_ws') || '';
tokenEl.value = localStorage.getItem('em_admin') || '';

function setStatus(text, cls='') {
  connStatus.textContent = text;
  connStatus.className = 'status ' + cls;
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

function renderAgents() {
  agentsEl.innerHTML = agents.map(a => `
    <div class="card">
      <div class="agent-title">${escapeHtml(a.name)} — ${escapeHtml(a.user)}</div>
      <div class="small">${escapeHtml(a.id)}</div>
      <br>
      <div>${a.accessActive ? '🟢 acesso ativo' : '⚪ conectado'} · espectadores: ${a.watchers ?? 0}</div>
      <br>
      <button onclick="requestAccess('${a.id}')">Solicitar acesso</button>
      <button onclick="watchAgent('${a.id}')">Ver ao vivo</button>
      <button onclick="endAccess('${a.id}')">Encerrar</button>
    </div>
  `).join('');
}

window.requestAccess = id => send({ type: 'request_access', agentId: id });

window.watchAgent = id => {
  selectedAgentId = id;
  send({ type: 'watch', agentId: id });
};

window.endAccess = id => send({ type: 'end_access', agentId: id });

connectBtn.onclick = () => {
  const url = wsUrlEl.value.trim();
  const token = tokenEl.value;

  localStorage.setItem('em_ws', url);
  localStorage.setItem('em_admin', token);

  if (ws) {
    try { ws.close(); } catch {}
  }

  setStatus('Conectando...', 'wait');

  try {
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
  } catch {
    setStatus('URL inválida', 'bad');
    return;
  }

  ws.onopen = () => {
    send({ type: 'admin_hello', token });
  };

  ws.onmessage = async ev => {
    if (typeof ev.data === 'string') {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }

      if (msg.type === 'error') {
        setStatus(msg.message || 'Erro', 'bad');
        return;
      }

      if (msg.type === 'admin_ready') {
        setStatus('Conectado', 'ok');
        agents = msg.agents || [];
        renderAgents();
        return;
      }

      if (msg.type === 'agent_list') {
        agents = msg.agents || [];
        renderAgents();
        return;
      }

      if (msg.type === 'access_state') {
        const a = agents.find(x => x.id === msg.agentId);
        if (a) a.accessActive = !!msg.active;
        renderAgents();
        return;
      }

      return;
    }

    // Binary JPEG frame
    const blob = new Blob([ev.data], { type: 'image/jpeg' });
    const bmp = await createImageBitmap(blob);

    if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
      canvas.width = bmp.width;
      canvas.height = bmp.height;
    }

    ctx.drawImage(bmp, 0, 0);
    bmp.close();

    frames++;
    fpsFrames++;
    latEl.textContent = 'Frames recebidos: ' + frames;

    const now = performance.now();
    if (now - lastFps >= 1000) {
      const fps = fpsFrames * 1000 / (now - lastFps);
      fpsEl.textContent = 'FPS: ' + fps.toFixed(1);
      fpsFrames = 0;
      lastFps = now;
    }
  };

  ws.onclose = () => setStatus('Desconectado', 'bad');
  ws.onerror = () => setStatus('Erro de conexão', 'bad');
};

function escapeHtml(v='') {
  return String(v)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}
</script>
</body>
</html>
